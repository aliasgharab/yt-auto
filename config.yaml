# yt-auto channel config
channel:
  niche: >
    Embedded systems and operating-system concepts made dead simple: interrupts,
    watchdogs, GPIO, PWM, timers, DMA, bootloaders, RTOS tasks, scheduling,
    context switches, stack vs heap, virtual memory, deadlocks, race conditions,
    system calls, drivers. Audience: middle- and high-school students (13-18) and new developers; real terms, explained clearly, not watered down.
  voice_tone: "clear, confident, slightly playful; like a smart friend explaining at a whiteboard"

llm:
  backend: claude-cli        # headless Claude Code on your subscription; no API key
  model: sonnet

tts:
  voice: am_michael          # try: am_michael, am_adam, bm_george, af_heart, bf_emma
  speed: 1.08

# Shorts = two-character dialogue over gameplay (assets/gameplay/*.mp4)
duo:
  asker: Hiro                # asks the question (hook), reacts, pushes back
  explainer: Baymax          # answers: literal, deadpan, gentle; explains simply
  voice_backend: clone       # clone = Chatterbox zero-shot from assets/voices/*_ref.wav | kokoro
  tempo: 1.25                # speed-up applied to every line (pitch preserved); video timing follows
  max_seconds: 29            # HARD cap on the voiced dialogue: lines get sped up further (to tempo x1.2 max) to fit
  characters:
    Hiro:
      image: assets/characters/hiro.png
      side: left
      height: 600
      ref: assets/voices/hiro_ref.wav
      exaggeration: 0.6
      cfg_weight: 0.5
      voice: am_puck         # kokoro fallback
      speed: 1.18
      pitch: 1.10
      personality: "14-year-old robotics genius; impatient, sarcastic, curious, talks fast"
      famous_lines:          # the writer riffs on ONE of these for the ending (spin-off, not a quote dump)
        - "Look for a different angle."
        - "Nerd school?"
        - "Bot fighting is not illegal."
        - "Baymax, deactivate!"
        - "We're superheroes now."
    Baymax:
      image: assets/characters/baymax.png
      side: right
      height: 470
      ref: assets/voices/baymax_ref.wav
      exaggeration: 0.3
      cfg_weight: 0.4
      voice: am_echo
      speed: 1.02
      pitch: 0.97
      personality: "gentle, literal-minded healthcare robot; calm, deadpan, accidentally funny; explains things very simply"
      famous_lines:
        - "Hello. I am Baymax, your personal healthcare companion."
        - "On a scale of one to ten, how would you rate your pain?"
        - "I cannot deactivate until you say you are satisfied with your care."
        - "Are you satisfied with your care?"
        - "Hairy baby. Hairy baby."
        - "Fist bump. Ba-la-la-la-la."
        - "I am not fast."
        - "Low battery."

formats:
  short:
    size: [1080, 1920]
    target_words: [55, 76]     # always < 30 s (user rule); 80 words came out at 28.4 s
    lines: [6, 9]
  long:
    size: [1920, 1080]
    target_words: [900, 1300]  # ~6-9 min
    scenes: [14, 24]

render:
  fps: 30
  font_dir: ~/.local/share/fonts/Inter      # Inter-{Regular,SemiBold,Bold,ExtraBold,Black}.ttf (~ and $VARS expand)
  # font paths that don't exist fall back to the same file name under ~/.local/share/fonts or
  # /usr/share/fonts (CI installs both there: deploy/ci/install_fonts.sh)
  mono_font: /usr/share/fonts/cascadia-mono-nf-fonts/CascadiaMonoNF-Regular.otf
  encoder: h264_nvenc        # falls back to libopenh264 automatically

output_dir: out

# Runtime orchestration (yt-auto nightly / publish / stats / research / analyze; see deploy/systemd)
publish:
  timezone: America/Toronto
  slots: ["12:00", "19:00"]   # local peak-hour upload slots; one video per slot
  min_lead_hours: 1           # never schedule closer than this to "now"
  auto_approve: false         # true: nightly ticks Approve itself when QA passes (zero-intervention mode)
  shorts_per_night: 2
