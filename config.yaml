# yt-auto channel config
channel:
  name: Errata               # handle @ErrataStories; branding: tools/branding.py (avatar, banner, description, keywords)
  niche: >
    True tech stories told as 2-3 minute animated dark documentaries: famous machines, bugs, hacks,
    outages, engineering disasters and the people behind them, each built around the flaw, trick or
    idea that decided its fate (Enigma, the Morris worm, Therac-25, Y2K, Apollo 11's alarms, Stuxnet).
    Audience: curious teens and adults who like tech, history and how things really work.
  voice_tone: "calm, low, dry documentary narrator; dramatic facts, understated delivery"

# Which builder nightly/research use for new Idea rows: film (Remotion documentary, src/yt_auto/film.py)
# or short (Hiro/Baymax dialogue Shorts, duo.py). A row's own Format column overrides this.
default_format: film

# Monthly long-form: the first build night of a month with >= `films` unused Live films makes an 8-10 min
# compilation (src/yt_auto/cuts.py): voiced intro, chapter cards, the films without their title cards.
compilation:
  enabled: true
  films: 4

# Films: 2-3 min narrated documentaries made in film/ (Remotion; rules in film/CLAUDE.md)
film:
  dir: film
  voice_python: film/tools/voice/.venv/bin/python   # Chatterbox Turbo env; CI falls back to tools/clone/.venv
  director_model: opus       # Claude Code writes the scenes (src/films/<slug>/) and the script
  director_timeout_min: 150
  words: [290, 350]          # narration words: Enigma's 348 words = 2:29 of voice + 13 s title = 2:43 (keeps 'Under 3 Minutes')

llm:
  backend: claude-cli        # headless Claude Code on your subscription; no API key
  model: sonnet
  helper:                    # FREE model first for these tasks, Claude only as fallback (src/yt_auto/helper.py)
    model: opencode/deepseek-v4.1-flash-free
    tasks: [editor, story_editor, research, analyze, compilation]   # film script, director, repair, vision QA and the
                             # pre-publish script check stay on Claude (quality gates; the free model can't see images)

tts:
  voice: am_michael          # try: am_michael, am_adam, bm_george, af_heart, bf_emma
  speed: 1.08

# Shorts = two-character dialogue over gameplay (assets/gameplay/*.mp4)
duo:
  asker: Hiro                # asks the question (hook), reacts, pushes back
  explainer: Baymax          # answers: literal, deadpan, gentle; explains simply
  voice_backend: clone       # clone = Chatterbox zero-shot from assets/voices/*_ref.wav (slow)
                             # rvc = Kokoro TTS -> Applio RVC model per character (fast; falls back to
                             #       clone if an rvc_model file is missing) | kokoro = plain Kokoro
  tempo: 1.0                 # speed applied to every line (pitch preserved); 1.0 = natural (user, 2026-11-21)
  max_seconds: 29            # HARD cap on the voiced dialogue: only if a script runs long, lines get sped up (x1.2 max) to fit
  characters:
    Hiro:
      image: assets/characters/hiro.png
      side: left
      height: 600
      ref: assets/voices/hiro_ref.wav
      exaggeration: 0.6
      cfg_weight: 0.5
      voice: am_puck         # kokoro voice (kokoro backend, and the rvc backend's source speech)
      rvc_model: assets/voices/rvc/hiro.pth     # tools/rvc/train.sh output
      rvc_index: assets/voices/rvc/hiro.index
      rvc_pitch: 0           # semitones applied by RVC to the Kokoro voice
      speed: 1.18
      pitch: 1.10
      personality: "14-year-old robotics genius; impatient, sarcastic, curious, talks fast"
    Baymax:
      image: assets/characters/baymax.png
      side: right
      height: 470
      ref: assets/voices/baymax_ref.wav
      exaggeration: 0.3
      cfg_weight: 0.4
      voice: am_echo
      rvc_model: assets/voices/rvc/baymax.pth
      rvc_index: assets/voices/rvc/baymax.index
      rvc_pitch: 0
      speed: 1.02
      pitch: 0.97
      personality: "gentle, literal-minded healthcare robot; calm, deadpan, accidentally funny; explains things very simply"

formats:
  short:
    size: [1080, 1920]
    target_words: [56, 64]     # always < 30 s at tempo 1.0: clone voice ~2.3 words/s (82 words = 35 s)
    lines: [5, 8]
  long:
    size: [1920, 1080]
    target_words: [900, 1300]  # ~6-9 min
    scenes: [14, 24]

render:
  fps: 30
  font_dir: ~/.local/share/fonts/Inter      # Inter-{Regular,SemiBold,Bold,ExtraBold,Black}.ttf (~ and $VARS expand)
  # font paths that don't exist fall back to the same file name under ~/.local/share/fonts or
  # /usr/share/fonts (CI installs both there: deploy/ci/install_fonts.sh)
  mono_font: /usr/share/fonts/cascadia-mono-nf-fonts/CascadiaMonoNF-Regular.otf
  encoder: h264_nvenc        # falls back to libopenh264 automatically

output_dir: out

# Runtime orchestration (yt-auto nightly / publish / stats / research / analyze; see deploy/systemd)
publish:
  timezone: America/Toronto
  slots: ["17:00"]           # fallback for formats without their own slots below
  slots_by_format:           # Toronto times. Film day D 17:00 -> its Short day D+1 12:00 -> every day has an upload
    film: ["17:00"]
    compilation: ["11:00"]
    short: ["12:00"]
  short_after_film_hours: 12  # a film's Short (Source film-cut) never goes out before film + this (it links to the film)
  build_days: [mon, wed, fri, sun]   # 4 films a week (user, 2026-11-22); other nights only publish
  min_lead_hours: 1           # never schedule closer than this to "now"
  auto_approve: true          # no human approval: anything that passes QA publishes (user, 2026-11-22). QA is strict:
                              # media checks, visual review + one automatic repair, script check (agents.qa_review)
  shorts_per_night: 5         # Shorts format: max under the 10,000 units/day API quota (~1,650 per Short)
  videos_per_night: 1         # what nightly builds (default_format). Films: ~1 h each on a free runner; upload
                              # 1,600 + captions 400 + thumbnail 50 + schedule 50 quota units

# Live analytics + reaction (yt-auto stats; see src/yt_auto/analytics.py for all keys + defaults)
analytics:
  sweep_hours: 6             # full refresh cadence (the 30-min publish cron also catches 1h/6h/24h/72h/7d checkpoints)
  winner_ratio: 1.5          # 72 h views vs rolling median of the last 20 Shorts
  loser_ratio: 0.3
  max_followups: 3           # per series
  hook_min_view_pct: 60      # day-4 hook check
  hook_min_engaged_ratio: 0.5
  cadence_floor_views: 0     # 0 = off: always make shorts_per_night (user wants max volume); was 100
  similarity_threshold: 0.85 # policy guard vs the last 30 titles/scripts

# Self-healing
heal:
  build_tries: 2             # attempts per Short on transient errors (then the row goes back to Idea)
