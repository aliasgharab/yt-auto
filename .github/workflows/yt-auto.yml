# yt-auto on GitHub Actions (public repo => standard runners are free).
# Notion is the source of truth; runners are ephemeral. Renders are uploaded to YouTube as PRIVATE previews
# right after rendering; approving in Notion makes `publish` set publishAt (no re-upload).
#
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`), NOTION_JSON (~/.config/yt-auto/notion.json),
#          YOUTUBE_CLIENT_SECRET, YOUTUBE_TOKEN (client_secret.json / youtube_token.json), NTFY_TOPIC,
#          ASSETS_TOKEN (fine-grained PAT: Contents read-only on the private yt-auto-assets repo)
# Variables (optional): ASSETS_REPO (default <owner>/yt-auto-assets)
name: yt-auto
# The task in the run title lets the once-a-day guard below find earlier nightlies.
run-name: ${{ inputs.task || (github.event.schedule == '30 7 * * *' && 'nightly') || (github.event.schedule == '15 7 * * *' && 'preflight') || (github.event.schedule == '0 15 * * 0' && 'weekly') || 'publish' }}${{ inputs.count && format(' (count {0})', inputs.count) || '' }}

on:
  schedule:
    - cron: "15 7 * * *"     # preflight  02:15 Toronto (EST): Chatterbox + Notion/YouTube/Claude logins
    - cron: "30 7 * * *"     # nightly    02:30 Toronto (EST)
    - cron: "*/30 * * * *"   # publish    every 30 min (+ stats sweep when a checkpoint is due / every 6 h)
    - cron: "0 15 * * 0"     # weekly     Sun 10:00 Toronto: research, stats, analyze
  workflow_dispatch:
    inputs:
      task:
        description: what to run
        type: choice
        options: [nightly, publish, weekly, preflight]
        default: publish
      count:
        description: Shorts to build (nightly only; blank = config default)
        required: false
        default: ""

# publish (every 30 min) gets its own group: sharing one with the nightly let a queued publish cancel the
# pending nightly (a group keeps only ONE pending run). preflight + nightly share "build" (preflight first).
concurrency:
  group: yt-auto-${{ (github.event.schedule == '0 15 * * 0' || inputs.task == 'weekly') && 'weekly' || ((github.event.schedule == '*/30 * * * *' || inputs.task == 'publish') && 'board' || 'build') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Once-a-day guard for the nightly. GitHub's native cron fires hours late (16:17Z on 2026-11-20, 15:29Z on
  # 2026-11-21) after the heartbeat already dispatched the 07:30Z nightly, so two full builds ran per day.
  # Skips this nightly if an EARLIER nightly (plain, no count) succeeded or is still running in the last 20 h.
  # Manual runs with a count always go. Fails open: if the API call breaks, the nightly runs.
  gate:
    if: (inputs.task == 'nightly' || github.event.schedule == '30 7 * * *') && !inputs.count
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w yt-auto.yml -L 100 \
                --json databaseId,displayTitle,createdAt,status,conclusion \
                --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID and .displayTitle == \"nightly\"
                        and (.createdAt | fromdateiso8601) > (now - 72000)
                        and (.status != \"completed\" or .conclusion == \"success\"))] | length") || n=0
          echo "earlier nightlies in the last 20 h: $n"
          if [ "${n:-0}" -gt 0 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping: a nightly already ran in the last 20 h (late duplicate cron)."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'skipped' || needs.gate.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write          # films commit their generated code back + attach renders to releases (cuts.persist_film)          # a film: voice ~10 min + director up to 150 + render ~30 (6 h job cap)
    env:
      TASK: ${{ inputs.task || (github.event.schedule == '30 7 * * *' && 'nightly') || (github.event.schedule == '15 7 * * *' && 'preflight') || (github.event.schedule == '0 15 * * 0' && 'weekly') || 'publish' }}
      YT_AUTO_CONFIG_DIR: ${{ github.workspace }}/.ci-config
      PYTHONUNBUFFERED: "1"
      RVC_DEVICE: cpu            # no GPU on the runner (tools/rvc/rvc_convert.py)
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}   # gh release create/upload/download for films
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Python deps
        run: uv sync --frozen

      - name: Credentials
        env:
          NOTION_JSON: ${{ secrets.NOTION_JSON }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          umask 077
          mkdir -p "$YT_AUTO_CONFIG_DIR"
          printf '%s' "$NOTION_JSON" > "$YT_AUTO_CONFIG_DIR/notion.json"
          if [ -n "$YOUTUBE_TOKEN" ]; then
            printf '%s' "$YOUTUBE_CLIENT_SECRET" > "$YT_AUTO_CONFIG_DIR/client_secret.json"
            printf '%s' "$YOUTUBE_TOKEN" > "$YT_AUTO_CONFIG_DIR/youtube_token.json"
          fi

      # ---- heavy setup: only the nightly render and the weekly agents need these
      - name: Claude Code CLI
        if: env.TASK != 'publish'
        run: npm install -g @anthropic-ai/claude-code

      - name: Free helper LLM (opencode; Claude is the fallback)
        if: env.TASK == 'nightly' || env.TASK == 'weekly'
        continue-on-error: true    # without it every helper task just goes to Claude
        run: |
          curl -fsSL https://opencode.ai/install | bash
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.jsonc <<'JSON'
          {"$schema": "https://opencode.ai/config.json",
           "permission": {"edit": "deny", "bash": "deny", "webfetch": "deny", "websearch": "deny",
                          "task": "deny", "external_directory": "deny", "doom_loop": "deny"}}
          JSON
          ~/.opencode/bin/opencode --version

      - name: ffmpeg
        if: env.TASK == 'nightly'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zstd fontconfig

      - name: Voice backend
        if: env.TASK == 'nightly'
        run: |   # rvc needs its models + an Applio env; anything missing -> duo.py falls back to clone
          if grep -qE '^\s*voice_backend:\s*rvc\b' config.yaml; then echo "RVC=1" >> "$GITHUB_ENV"; fi

      - name: Assets (private release)
        if: env.TASK == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
          ASSETS_REPO: ${{ vars.ASSETS_REPO || format('{0}/yt-auto-assets', github.repository_owner) }}
        run: deploy/ci/fetch_assets.sh

      - name: Model cache (whisper, Chatterbox)
        if: env.TASK == 'nightly' || env.TASK == 'preflight'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config.yaml') }}
          restore-keys: hf-

      - name: Chatterbox clone venv (CPU torch)
        if: env.TASK == 'nightly' || env.TASK == 'preflight'
        run: |
          uv venv -p 3.11 tools/clone/.venv
          for i in 1 2 3; do   # transient PyPI / download hiccups: retry with backoff
            uv pip install -p tools/clone/.venv/bin/python --index-strategy unsafe-best-match \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              torch==2.6.0 torchaudio==2.6.0 chatterbox-tts==0.1.7 "setuptools<81" \
              pyloudnorm faster-whisper soundfile && break   # + film/scripts/make_voice.py needs
            [ $i = 3 ] && exit 1; sleep $((i * 20))
          done

      - name: Applio env cache (rvc backend)
        if: env.TASK == 'nightly' && env.RVC == '1'
        uses: actions/cache@v4
        with:
          path: tools/rvc/Applio
          key: applio-cpu-${{ hashFiles('deploy/ci/install_rvc.sh') }}

      - name: Applio env (rvc backend, CPU)
        if: env.TASK == 'nightly' && env.RVC == '1'
        continue-on-error: true    # without it the render still goes out with the clone voices
        run: |
          for i in 1 2 3; do
            deploy/ci/install_rvc.sh && break
            [ $i = 3 ] && exit 1; sleep $((i * 20))
          done

      # ---- films (default_format: film): Node + Remotion + headless Chrome
      - name: Film format?
        if: env.TASK == 'nightly'
        run: if grep -qE '^default_format:\s*film\b' config.yaml; then echo "FILM=1" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-node@v4
        if: env.TASK == 'nightly' && env.FILM == '1'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: film/package-lock.json

      - name: Remotion (npm ci + Chrome headless shell)
        if: env.TASK == 'nightly' && env.FILM == '1'
        working-directory: film
        run: |
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libxrandr2 \
            libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2 \
            libasound2t64 || sudo apt-get install -y -qq libasound2 || true
          npm ci
          npx remotion browser ensure

      # ---- run
      - name: preflight
        if: env.TASK == 'preflight'
        run: uv run yt-auto preflight

      - name: nightly
        if: env.TASK == 'nightly'
        run: uv run yt-auto nightly ${{ inputs.count && format('--count {0}', inputs.count) || '' }}

      - name: publish
        if: env.TASK == 'publish'
        run: uv run yt-auto publish

      - name: stats sweep (only when a checkpoint is due or every ~6 h; ~1 quota unit per 50 videos)
        if: env.TASK == 'publish'
        continue-on-error: true
        run: uv run yt-auto stats --due

      - name: weekly
        if: env.TASK == 'weekly'
        run: |
          uv run yt-auto research || true
          uv run yt-auto stats || true
          uv run yt-auto analyze

      # previews whose YouTube upload failed are kept here for 7 days (see pipeline._fallback)
      - name: Video artifacts
        if: always() && env.TASK == 'nightly'
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Wipe credentials
        if: always()
        run: rm -rf "$YT_AUTO_CONFIG_DIR"
