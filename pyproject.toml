[project]
name = "yt-auto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pygments>=2.21.0",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
]

[project.scripts]
yt-auto = "yt_auto:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
